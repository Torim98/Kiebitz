<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <title>Kiebitz</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23103528'/><g transform='translate(4 4)' fill='none' stroke='%2322c08a' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M16 7h.01'/><path d='M3.4 18H12a8 8 0 0 0 8-8V7a4 4 0 0 0-7.28-2.3L2 20'/><path d='m20 7 2 .5-2 .5'/><path d='M10 18v3'/><path d='M14 17.75V21'/><path d='M7 18a6 6 0 0 0 3.84-10.61'/></g></svg>" />
    <style>html { background: #0e0e0d; }</style>
    <!-- Gewähltes Thema vor dem ersten Bild setzen.

         Die Einstellungen liegen im Backend und treffen erst nach dem Start
         ein; ohne diesen Vorgriff stünde die App bei „Hell" für einen Moment
         in Dunkel. Farben stehen hier bewusst keine: Der Zwischenspeicher
         enthält den Grundton, den die App zuletzt selbst gemessen hat, und
         `src/themes.css` bleibt die einzige Quelle. Siehe src/lib/theme.ts. -->
    <script>
      try {
        var cached = JSON.parse(localStorage.getItem("kiebitz.appearance") || "null");
        if (cached && cached.theme) {
          document.documentElement.dataset.theme = cached.theme;
          if (cached.board) document.documentElement.dataset.board = cached.board;
          if (cached.bg) document.documentElement.style.background = cached.bg;
        }
      } catch (e) {
        /* Kein Speicher, kaputter Eintrag · dann eben im Standardthema. */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
