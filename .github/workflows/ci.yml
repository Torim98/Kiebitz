name: CI

# Schnelle Frontend-Checks bei jedem Push/PR auf main: Typecheck + Unit-/
# Component-Tests (Vitest). Der Release-Build läuft separat in release.yml.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Node einrichten
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Tests
        run: npm run test:run

  rust:
    # Windows already provides the native Tauri/WebView dependencies, avoiding
    # the extra GTK/WebKit system packages needed by Linux runners.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Rust einrichten
        uses: dtolnay/rust-toolchain@stable

      - name: Rust-Build cachen
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # tauri.conf.json bundles this file, so Tauri's build script requires it
      # even for `cargo test`. Keep this pin in sync with release.yml and the
      # licensing metadata in src-tauri/resources/stockfish/NOTICE.txt.
      - name: Stockfish holen (Windows, AVX2)
        shell: pwsh
        run: |
          $url = "https://github.com/official-stockfish/Stockfish/releases/download/sf_18/stockfish-windows-x86-64-avx2.zip"
          $expected = "6f6c272ebd6ea594377715235c8a7326f75940ef4f4f856f45106028fe6ae900"
          Invoke-WebRequest $url -OutFile sf.zip
          $actual = (Get-FileHash sf.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Stockfish archive has unexpected SHA-256: $actual" }
          Expand-Archive sf.zip -DestinationPath sf -Force
          $exe = Get-ChildItem sf -Recurse -Filter *.exe | Select-Object -First 1
          if (-not $exe) { throw "Stockfish archive contains no executable" }
          New-Item -ItemType Directory -Force -Path src-tauri/binaries | Out-Null
          Copy-Item $exe.FullName src-tauri/binaries/stockfish.exe

      - name: Tests
        working-directory: src-tauri
        run: cargo test

  rust-linux:
    # Nur übersetzen, nicht testen. Die Tests laufen auf Windows; hier geht es
    # allein darum, dass der Nicht-Windows-Zweig überhaupt kompiliert —
    # `cfg(desktop)`-Code (Sync-Hub) und `cfg(not(windows))`-Zweige
    # (Erinnerungen, Engine) sieht der Windows-Job nie. Ohne diesen Job fiele so
    # ein Fehler erst im Release-Build für macOS/Linux auf, also nach dem Tag.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Rust einrichten
        uses: dtolnay/rust-toolchain@stable

      - name: Rust-Build cachen
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: linux-check

      - name: Systemabhängigkeiten (WebKitGTK)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev patchelf file build-essential

      # tauri-build prüft die in tauri.linux.conf.json gelisteten Ressourcen auf
      # Existenz. Für einen reinen Compile-Check reicht eine leere Datei — die
      # echte Engine holt erst der Release-Build.
      - name: Stockfish-Platzhalter
        run: |
          mkdir -p src-tauri/binaries
          : > src-tauri/binaries/stockfish

      - name: Übersetzen
        working-directory: src-tauri
        run: cargo check --all-targets

  licenses:
    # Prüft, dass die gebündelte Lizenzsammlung zu den aktuellen Abhängigkeiten
    # passt. MIT/BSD/ISC verlangen die Weitergabe ihres Textes — eine veraltete
    # Sammlung wäre eine Lizenzverletzung, die sonst niemandem auffällt.
    #
    # Kein Build nötig: `cargo metadata` (im Skript) entpackt die Crate-Quellen
    # bereits, und npm ci liefert die Lizenzdateien der npm-Pakete.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Node einrichten
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Rust einrichten
        uses: dtolnay/rust-toolchain@stable

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Lizenzsammlung aktuell?
        run: npm run licenses:check
